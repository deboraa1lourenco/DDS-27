<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>   
    <form action="">
        <!-- FIELDSET = SEGMENTA VISUALMENTE O FORMULÁRIO -->
         <fieldset>
            <!-- LEGEND = TÍTULO DO SEGMENTO -->
             <legend> Dados Pessoais</legend>

             <!-- CAIXINHA DE NOME  -->
             <label for="nome"> Nome: </label>
             <input type="text" name="nome" id="nome">
            <!-- FIM CAIXINHA DE NOME  -->

            <!-- CAIXINHA DATA DE NASCIMENTO -->
             <label for=""> Data de Nascimento: </label>
             <!-- DATE = APENAS DATA -->
             <input type="date" name="" id="">
             <!-- DATETIME-LOCAL = DATA E HORA JUNTOS -->
             <input type="datetime-local">
             <!-- TIME - APENAS HORA -->
            <input type="time">
            <!-- FIM CAIXINHA DATA DE NASCIMENTO  -->

            <br><br>

            <!-- CAIXINHA DE NÚMEROS -->
             <label for="filhos">Quantidade de filhos: </label>
             <input type="number" name="filhos" id="filhos" min="-3" max="301" step="0.7" value="5"
             <!-- FIM DA CAIXINHA DE NÚMEROS -->
         </fieldset>


    </form>
</body>
</html>
